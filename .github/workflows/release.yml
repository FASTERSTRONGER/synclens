name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run tests
        run: go test -v ./...

      - name: Build Windows binary
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          BIN_NAME="synclens-${GITHUB_REF_NAME}.exe"
          go build -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME}" -o "$BIN_NAME" ./cmd/synclens

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BIN_NAME="synclens-${GITHUB_REF_NAME}.exe"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$BIN_NAME" --clobber
            gh release delete-asset "${GITHUB_REF_NAME}" synclens.exe --yes || true
          else
            gh release create "${GITHUB_REF_NAME}" "$BIN_NAME" --title "SyncLens ${GITHUB_REF_NAME}" --generate-notes
          fi
