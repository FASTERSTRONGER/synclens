name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run tests
        run: go test -v ./...

      - name: Embed Windows icon and version metadata
        run: |
          VER_RAW="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MAJ MIN PAT BLD <<< "$VER_RAW"
          WIN_VER="${MAJ:-0}.${MIN:-0}.${PAT:-0}.${BLD:-0}"
          go run github.com/tc-hib/go-winres@v0.3.3 make \
            --in winres/winres.json \
            --out cmd/synclens/rsrc \
            --arch amd64 \
            --product-version="$WIN_VER" \
            --file-version="$WIN_VER"

      - name: Build Windows binary
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -ldflags "-s -w -X main.Version=${{ github.ref_name }}" -o synclens.exe ./cmd/synclens

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" synclens.exe --title "SyncLens ${{ github.ref_name }}" --generate-notes
