name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run tests
        run: go test -v ./...

      - name: Embed Windows icon and version metadata
        run: |
          VER_RAW="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MAJ MIN PAT BLD <<< "$VER_RAW"
          WIN_VER="${MAJ:-0}.${MIN:-0}.${PAT:-0}.${BLD:-0}"
          go run github.com/tc-hib/go-winres@v0.3.3 make \
            --in winres/winres.json \
            --out cmd/synclens/rsrc \
            --arch amd64 \
            --product-version="$WIN_VER" \
            --file-version="$WIN_VER"

      - name: Build Windows binary
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          BIN_NAME="synclens-${GITHUB_REF_NAME}.exe"
          go build -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME}" -o "$BIN_NAME" ./cmd/synclens

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BIN_NAME="synclens-${GITHUB_REF_NAME}.exe"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$BIN_NAME" --clobber
            gh release delete-asset "${GITHUB_REF_NAME}" synclens.exe --yes || true
          else
            gh release create "${GITHUB_REF_NAME}" "$BIN_NAME" --title "SyncLens ${GITHUB_REF_NAME}" --generate-notes
          fi
